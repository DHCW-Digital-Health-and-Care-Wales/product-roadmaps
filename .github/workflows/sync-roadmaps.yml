name: Sync roadmaps from Google Sheets

on:
  schedule:
    - cron: '0 2 * * *' # nightly, 02:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-roadmaps
  cancel-in-progress: false

jobs:
  # Runs npm code, so it gets a read-only token and no install scripts.
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run sync
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: roadmaps-snapshot
          path: src/data/roadmaps.json
          retention-days: 1

  # Can push and dispatch, so it runs no npm code.
  publish:
    needs: sync
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: roadmaps-snapshot
          path: src/data
      # Pushes made with GITHUB_TOKEN don't trigger the push-based deploy, so dispatch it.
      - name: Commit snapshot and deploy if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- src/data/roadmaps.json; then
            echo "No roadmap changes."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/roadmaps.json
          git commit -m 'Update roadmap snapshot from Google Sheets'
          git push
          gh workflow run deploy.yml --ref main
