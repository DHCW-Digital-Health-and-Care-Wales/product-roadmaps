# Keeps the SHA-pinned actions in .github/workflows current: one grouped pull request a
# month, proposing a version only once it is a week old. The code these workflows build
# is in the roadmaps repository, whose Dependabot updates its dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
