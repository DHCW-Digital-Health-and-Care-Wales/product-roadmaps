    - term:
      - link "Nawr":
        - /url: "#horizon-now"
    - definition: Gwaith sydd ar y gweill nawr ac sy’n llywio’r newidiadau nesaf i’r gwasanaeth.
    - term:
      - link "Nesaf":
        - /url: "#horizon-next"
    - definition: Gwaith rydym yn disgwyl ei ddechrau cyn bo hir wrth i’r gwaith cyflawni presennol fynd rhagddo.
    - term:
      - link "Hwyrach":
        - /url: "#horizon-later"
    - definition: Cyfeiriad tymor hwy a fydd yn parhau i esblygu wrth i ni ddysgu mwy.
    - paragraph: Nid ydym yn rhoi dyddiadau ar y gwaith hwn, ac nid yw’r drefn yn rhestr o flaenoriaethau.
